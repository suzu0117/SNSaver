<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <link rel="stylesheet" href="./destyle.css" />
        <link rel="stylesheet" href="./style.css" />
        <title>SNSaver</title>
    </head>
    <body>
        <header>
            <div class="logo"><img src="./logo.svg" alt="" /></div>
        </header>
        <main>
            <section class="top">
                <h1 class="top__message">
                    Download Instagram Photos and Videos
                </h1>
                <p class="top__description">
                    Enter an Instagram username to download all public photos
                    and videos as a ZIP file.
                </p>
            </section>

            <section id="search" class="search">
                <input
                    type="text"
                    id="search__input-username"
                    class="search__input-username"
                    placeholder="input username"
                />
                <button id="search__button" class="search__button"></button>
            </section>
            <section id="user" class="user"></section>
            <section id="download" class="download">
                <button id="download__button" class="download__button hidden">
                    Download
                </button>
            </section>
            <div id="spinner" class="spinner hidden"></div>
        </main>
        <footer>
            <nav class="footer-nav">
                <ul class="footer-nav__list">
                    <li class="footer-nav__item">
                        <a href="" class="footer-nav__link">link</a>
                    </li>
                </ul>
            </nav>
        </footer>
        <script src="./main.js"></script>
    </body>
</html>
