<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <link rel="stylesheet" href="./destyle.css" />
        <link rel="stylesheet" href="./style.css" />
        <title>SNSaver</title>
    </head>
    <body>
        <div class="first-view">
            <header>
                <div class="logo"><img src="./logo.svg" alt="" /></div>
            </header>

            <main>
                <section class="top">
                    <h1 class="top__message">
                        Download Instagram Photos and Videos
                    </h1>
                    <p class="top__description">
                        Enter an Instagram username to download all public
                        photos and videos as a ZIP file.
                    </p>
                </section>

                <section id="input-area" class="input-area">
                    <div class="media-type">
                        <label>
                            <input
                                type="radio"
                                id="media-type-all"
                                name="media-type"
                                checked
                                class="media-type__item"
                            />
                            <span>All</span>
                        </label>

                        <label>
                            <input
                                type="radio"
                                id="media-type-images"
                                name="media-type"
                                class="media-type__item"
                            />
                            <span>Images</span>
                        </label>

                        <label>
                            <input
                                type="radio"
                                id="media-type-videos"
                                name="media-type"
                                class="media-type__item"
                            />
                            <span>Videos</span>
                        </label>
                    </div>

                    <div class="username">
                        <input
                            type="text"
                            id="username-input"
                            class="username__input"
                            placeholder="input username"
                        />
                        <button
                            id="search-button"
                            class="username__search-button"
                        ></button>
                    </div>
                </section>

                <section id="user" class="user"></section>
                <section id="download" class="download">
                    <button id="download__button" class="download__button">
                        Download
                    </button>
                </section>
                <div id="spinner" class="spinner hidden"></div>
            </main>
        </div>
