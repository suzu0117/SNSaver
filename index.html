<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="./image/favicon.svg" />
        <link rel="stylesheet" href="./css/destyle.css" />
        <link rel="stylesheet" href="./css/style.css" />
        <title>SNSaver - All Posts to ZIP Downloader</title>
    </head>
    <body>
        <div class="first-view">
            <header>
                <div class="logo"><img src="./image/logo.svg" alt="" /></div>
            </header>

            <main>
                <section class="top">
                    <h1 class="top__message">
                        Download Instagram Photos and Videos
                    </h1>
                    <p class="top__description">
                        Enter an Instagram username to download all public
                        photos and videos as a ZIP file.
                    </p>
                </section>

                <section id="input-area" class="input-area">
                    <div class="media-type">
                        <label>
                            <input
                                type="radio"
                                id="media-type-all"
                                name="media-type"
                                checked
                                class="media-type__item"
                            />
                            <span>All</span>
                        </label>

                        <label>
                            <input
                                type="radio"
                                id="media-type-images"
                                name="media-type"
                                class="media-type__item"
                            />
                            <span>Images</span>
                        </label>

                        <label>
                            <input
                                type="radio"
                                id="media-type-videos"
                                name="media-type"
                                class="media-type__item"
                            />
                            <span>Videos</span>
                        </label>

                        <label>
                            <input
                                type="radio"
                                id="media-type-reels"
                                name="media-type"
                                class="media-type__item"
                            />
                            <span>Reels</span>
                        </label>
                    </div>

                    <div class="username">
                        <input
                            type="text"
                            id="username-input"
                            class="username__input"
                            placeholder="Enter username or profile URL"
                        />
                        <button
                            id="search-button"
                            class="username__search-button"
                        ></button>
                    </div>
                </section>

                <section id="user" class="user"></section>

                <div id="loading" class="loading hidden">
                    <div id="spinner" class="loading__spinner"></div>
                    <p id="loading-message" class="loading__message"></p>
                </div>

                <button id="download-button" class="download-button hidden">
                    Download
                </button>

                <p id="error-message" class="error-message hidden">
                    An unexpected error occurred.
                </p>
            </main>
        </div>

        <footer>
            <section id="contact" class="contact">
                <h2 class="section-title">Contact</h2>

                <form action="" id="contact-from" class="contact-form">
                    <div class="contact-form__item">
                        <label for="" class="contact-form__label">Name</label>
                        <input
                            name="name"
                            type="name"
                            class="contact-form__input"
                            required
                        />
                    </div>
                    <div class="contact-form__item">
                        <label for="" class="contact-form__label">E-mail</label>
                        <input
                            name="mail"
                            type="email"
                            class="contact-form__input"
                            required
                        />
                    </div>
                    <div class="contact-form__item">
                        <label for="" class="contact-form__label">
                            Message
                        </label>
                        <textarea
                            name="message"
                            id=""
                            rows="20"
                            class="contact-form__textarea"
                            required
                        ></textarea>
                    </div>
                    <button
                        id="contact-form-button"
                        class="contact-form__button"
                    >
                        Submit
                    </button>
                </form>
            </section>

            <span class="copyright">© 2026 snsaver</span>
        </footer>
        <script src="./js/main.js"></script>
    </body>
</html>
