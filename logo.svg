<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- SNS / Instagram風グラデーション -->
    <linearGradient id="socialGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f09433"/>
      <stop offset="25%" stop-color="#e6683c"/>
      <stop offset="50%" stop-color="#dc2743"/>
      <stop offset="75%" stop-color="#cc2366"/>
      <stop offset="100%" stop-color="#bc1888"/>
    </linearGradient>

    <!-- ダウンロード矢印のグラデーション（鮮やかなブルー） -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    <!-- ドロップシャドウ（白背景での立体感用） -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- アイコン部分（左側） -->
    <g transform="translate(20, 10)">
      <!-- 外枠リング -->
      <circle cx="50" cy="50" r="42" fill="none" stroke="url(#socialGrad)" stroke-width="10"/>
      <!-- レンズ/アパチャーの絞り線 -->
      <path d="M 50 8 A 42 42 0 0 1 85 29 L 60 50 Z" fill="url(#socialGrad)" opacity="0.15"/>
      <path d="M 85 29 A 42 42 0 0 1 92 65 L 50 50 Z" fill="url(#socialGrad)" opacity="0.25"/>
      <path d="M 92 65 A 42 42 0 0 1 68 90 L 50 50 Z" fill="url(#socialGrad)" opacity="0.15"/>
      <path d="M 68 90 A 42 42 0 0 1 32 90 L 50 50 Z" fill="url(#socialGrad)" opacity="0.25"/>
      <!-- 中央のダウンロード矢印 -->
      <path d="M 50 22 L 50 62 M 35 48 L 50 63 L 65 48" fill="none" stroke="url(#arrowGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- 右上のドットアクセント -->
      <circle cx="72" cy="28" r="4" fill="#00C6FF"/>
    </g>

    <!-- ロゴテキスト部分（右側） -->
    <!-- メインブランド名: SNSaver -->
    <text x="135" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="40" fill="#1E293B" letter-spacing="-0.5">SN<tspan fill="url(#socialGrad)">Saver</tspan></text>
    
    <!-- 機能がひと目で伝わる新サブテキスト -->
    <text x="137" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="0.5">All Posts to ZIP Downloader</text>
  </g>
</svg>
